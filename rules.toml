# Detection rules. One [[rule]] per detection; for each event, the FIRST rule
# that matches wins, so put specific rules before generic ones.
#
#   id       = 4624            # EventID, or a list: [4728, 4732]
#   channel  = "Security"      # optional, but the same ID means different
#                              # things in different logs: set it
#   severity = "warning"       # info | warning | critical
#   message  = "..."
#   where    = { Field = "value" }   # optional conditions on payload fields
#
# Every `where` condition must hold. Values are strings, compared ignoring
# case, with `*` allowed at either end: "*-544" (ends with), "cmd*" (starts
# with), "*enc*" (contains). A list means "any of": ["*-512", "*-544"].

# --- Security: covering tracks -------------------------------------------

[[rule]]
id = 1102
channel = "Security"
severity = "critical"
message = "Security audit log was cleared"

[[rule]]
id = 4719
channel = "Security"
severity = "critical"
message = "System audit policy was changed"

# --- Security: accounts and groups ---------------------------------------

[[rule]]
id = 4720
channel = "Security"
severity = "warning"
message = "User account was created"

[[rule]]
id = 4722
channel = "Security"
severity = "info"
message = "User account was enabled"

[[rule]]
id = 4724
channel = "Security"
severity = "warning"
message = "Password reset by another account"

[[rule]]
id = 4726
channel = "Security"
severity = "warning"
message = "User account was deleted"

[[rule]]
id = 4740
channel = "Security"
severity = "warning"
message = "User account was locked out"

# Group SIDs end with the group's RID: Administrators (544), Domain Admins
# (512), Schema Admins (518), Enterprise Admins (519).
[[rule]]
id = [4728, 4732, 4756]
channel = "Security"
severity = "critical"
message = "Member added to a privileged group"
where = { TargetSid = ["*-544", "*-512", "*-518", "*-519"] }

[[rule]]
id = [4728, 4732, 4756]
channel = "Security"
severity = "warning"
message = "Member added to a security group"

# --- Security: logons ----------------------------------------------------

[[rule]]
id = 4625
channel = "Security"
severity = "info"
message = "Failed logon attempt"

[[rule]]
id = 4624
channel = "Security"
severity = "warning"
message = "Remote Desktop logon"
where = { LogonType = "10" }

# 0x17 = RC4: what Kerberoasting tools request, rare on a modern domain.
[[rule]]
id = 4769
channel = "Security"
severity = "warning"
message = "RC4 Kerberos service ticket requested (possible Kerberoasting)"
where = { TicketEncryptionType = "0x17" }

# --- Persistence and lateral movement ------------------------------------

[[rule]]
id = 4698
channel = "Security"
severity = "warning"
message = "Scheduled task was created"

[[rule]]
id = 7045
channel = "System"
severity = "critical"
message = "Service runs a command interpreter or admin share (PsExec-style)"
where = { ImagePath = ["*powershell*", "*cmd.exe*", "*%COMSPEC%*", "*\\ADMIN$\\*"] }

[[rule]]
id = 7045
channel = "System"
severity = "warning"
message = "A service was installed on the system"

[[rule]]
id = 4697
channel = "Security"
severity = "warning"
message = "A service was installed on the system"

[[rule]]
id = 104
channel = "System"
severity = "critical"
message = "An event log was cleared"

# --- PowerShell script block logging -------------------------------------

[[rule]]
id = 4104
channel = "Microsoft-Windows-PowerShell/Operational"
severity = "warning"
message = "Suspicious PowerShell script block"
where = { ScriptBlockText = ["*FromBase64String*", "*DownloadString*", "*DownloadFile*", "*Invoke-Expression*", "*Invoke-Mimikatz*", "*MiniDumpWriteDump*", "*-EncodedCommand*"] }

# --- Sysmon --------------------------------------------------------------

[[rule]]
id = 1
channel = "Microsoft-Windows-Sysmon/Operational"
severity = "warning"
message = "Process started with an encoded or download-and-run command line"
where = { CommandLine = ["* -enc *", "*-EncodedCommand*", "*DownloadString*", "*FromBase64String*"] }

[[rule]]
id = 8
channel = "Microsoft-Windows-Sysmon/Operational"
severity = "warning"
message = "Thread injected into another process (CreateRemoteThread)"

[[rule]]
id = 10
channel = "Microsoft-Windows-Sysmon/Operational"
severity = "critical"
message = "LSASS process memory was accessed (possible credential dumping)"
where = { TargetImage = "*\\lsass.exe" }

# --- Windows Defender ----------------------------------------------------

[[rule]]
id = 1116
channel = "Microsoft-Windows-Windows Defender/Operational"
severity = "critical"
message = "Defender detected malware"

[[rule]]
id = 5001
channel = "Microsoft-Windows-Windows Defender/Operational"
severity = "critical"
message = "Defender real-time protection was disabled"
